<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Meta Tags -->
    <title>Vibeify — Dynamic Cyber-Glass Audio Player</title>
    <meta name="title" content="Vibeify — Dynamic Cyber-Glass Audio Player" />
    <meta name="description" content="Stream your favorite tracks with dynamic lighting, equalizer presets, and a responsive glassmorphism UI." />
    <meta name="theme-color" content="#0d0d12" />

    <!-- Favicon & App Icons (Place vibeify-logo.png inside public/ folder) -->
    <link rel="icon" type="image/png" href="/vibeify-logo.png" />
    <link rel="apple-touch-icon" href="/vibeify-logo.png" />

    <!-- Google Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" 
      rel="stylesheet" 
    />

    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vibeify — Cyber-Glass Audio Experience" />
    <meta property="og:description" content="Listen to curated playlists and customize your listening experience with dynamic themes." />
    <meta property="og:image" content="/vibeify-logo.png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vibeify" />
    <meta name="twitter:description" content="Dynamic web audio player with customizable cyber aesthetics." />
  </head>
  <body>
    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- Application Entry Module -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
