<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Enhanced viewport with interactive-widget support for seamless mobile keyboard handling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO Meta Tags -->
    <title>Vibeify — Dynamic Audio Player</title>
    <meta name="title" content="Vibeify — Dynamic Cyber-Glass Audio Player" />
    <meta name="description" content="Stream your favorite tracks with dynamic lighting, equalizer presets, and a responsive glassmorphism UI." />
    <meta name="keywords" content="music streaming, audio player, playlist app, glassmorphism UI, web music player, cyber aesthetics" />
    <meta name="author" content="Vibeify" />
    <meta name="theme-color" content="#07070a" />
    <link rel="canonical" href="https://vibeify-ashy.vercel.app/" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/vibeify-logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/vibeify-logo.png" />
    <link rel="apple-touch-icon" href="https://vibeify-ashy.vercel.app/vibeify-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Web App Capability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vibeify" />

    <!-- Performance Domain Preconnect & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Font Optimization -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="music.playlist" />
    <meta property="og:url" content="https://vibeify-ashy.vercel.app/" />
    <meta property="og:site_name" content="Vibeify" />
    <meta property="og:title" content="Vibeify — Cyber-Glass Audio Experience" />
    <meta property="og:description" content="Listen to curated playlists and customize your listening experience with dynamic themes." />
    <meta property="og:image" content="https://vibeify-ashy.vercel.app/vibeify-logo.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://vibeify-ashy.vercel.app/" />
    <meta name="twitter:title" content="Vibeify — Cyber-Glass Audio Player" />
    <meta name="twitter:description" content="Dynamic web audio player with customizable cyber aesthetics." />
    <meta name="twitter:image" content="https://vibeify-ashy.vercel.app/vibeify-logo.png" />

    <!-- Inline Critical Styles & Custom Cross-Platform Scrollbars -->
    <style>
      :root {
        color-scheme: dark;
        --bg-theme: #07070a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-theme);
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }

      /* Custom Modern Scrollbars for Desktop & Mobile Webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(7, 7, 10, 0.5);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        transition: background 0.3s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.5);
      }

      /* Prevent mobile text inflation on orientation change */
      html {
        -webkit-text-size-adjust: 100%;
      }
    </style>

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vibeify",
        "url": "https://vibeify-ashy.vercel.app/",
        "description": "Stream your favorite tracks with dynamic lighting, equalizer presets, and a responsive glassmorphism UI.",
        "applicationCategory": "MusicApplication",
        "operatingSystem": "Any browser",
        "browserRequirements": "Requires JavaScript and HTML5 Audio support."
      }
    </script>
  </head>
  <body>
    <!-- React Root Mount -->
    <div id="root"></div>

    <!-- Noscript Fallback -->
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; color: #ff4ecd; background: #07070a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h2>JavaScript Required</h2>
        <p style="color: #94a3b8; max-width: 400px; margin-top: 10px;">Vibeify requires JavaScript to run the audio player engine. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>

    <!-- Application Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
